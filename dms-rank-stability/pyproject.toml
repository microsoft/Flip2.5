[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-rank-stability"
version = "0.1.0"
description = "Reproducible rank-stability analysis for deep mutational scanning"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Renato Berlinghieri", email = "t-renatob@microsoft.com" },
]
dependencies = [
    "datashader>=0.16",
    "h5py>=3.10",
    "h5netcdf>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26,<2.5",
    "pandas>=2.0",
    "scipy>=1.12",
    "xarray>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
notebook = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbconvert>=7.16",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]