[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-fitness-stability"
version = "0.1.0"
description = "Stability analysis for deep mutational scanning fitness landscapes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Renato Berlinghieri", email = "t-renatob@microsoft.com" },
]
dependencies = [
    "arviz>=0.21,<1",
    "cmdstanpy[all]>=1.2.5,<1.3",
    "h5py>=3.11",
    "h5netcdf>=1.3",
    "matplotlib>=3.8",
    "numba>=0.66",
    "numpy>=1.26,<2.5",
    "pandas>=2.0",
    "scipy>=1.11",
    "scistanpy @ git+https://github.com/microsoft/SciStanPy.git@09c439f675ead70f851d814242f153ecb7712113",
    "xarray>=2024.1",
    "datashader>=0.18,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
