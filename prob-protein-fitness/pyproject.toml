[project]
name = "prob-protein-fitness"
version = "0.1.0"
description = "Probabilistic analysis of protein fitness using Bayesian inference with SciStanPy"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Renato Berlinghieri", email = "t-renatob@microsoft.com"}
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2023.0",
    "netcdf4>=1.6",
    "arviz>=0.15",
    "matplotlib>=3.5",
    "scipy>=1.10",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]
analysis = [
    "scikit-learn>=1.3",
    "seaborn>=0.12",
    "plotly>=5.0",
    "holoviews>=1.18",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Repository = "https://github.com/yourusername/prob-protein-fitness"
Documentation = "https://microsoft.github.io/SciStanPy/"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line too long (handled by black)

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
